services:

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://wc2026:wc2026pass@db:5432/wc2026
      JWT_SECRET:   ${JWT_SECRET:-change-me-in-production}
      PORT:         3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       wc2026
      POSTGRES_USER:     wc2026
      POSTGRES_PASSWORD: wc2026pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wc2026 -d wc2026"]
      interval: 5s
      timeout:  5s
      retries:  10
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
